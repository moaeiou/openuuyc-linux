[package]
name = "openuuyc"
version = "1.0.6"
edition = "2024"
description = "Third-party Rust client for UU Remote protocol interoperability"
license-file = "LICENSE"
publish = false
default-run = "openuuyc"
autobins = false

[[bin]]
name = "openuuyc"
path = "src/main.rs"

# `cargo deb`（仅 Linux）：由 Linux 工作流构建 deb 安装包。
[package.metadata.deb]
name = "openuuyc"
maintainer = "MoAEIOU <me@867678.xyz>"
copyright = "OpenUUYC contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Third-party client for UU Remote: sign in with an existing UU account, then \
view and control remote devices or accept remote control of this desktop \
(Xorg session)."""
section = "net"
priority = "optional"
# `$auto` 覆盖二进制直接链接的依赖；下列窗口、图形和音频库在运行时加载，需手动列出。
# FUSE 用于粘贴和拖放远端文件；界面需要中日韩字体。
depends = """$auto, fuse3, libx11-6, libx11-xcb1, libxcursor1, libxrandr2, libxi6, \
libxfixes3, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, \
libvulkan1 | libegl1, \
fonts-noto-cjk | fonts-wqy-microhei | fonts-arphic-uming"""
# gio（libglib2.0-bin）和 rsvg-convert（librsvg2-bin）用于绘制被控端的拖放预览；
# 缺少这些工具时，拖出文件没有预览图。
recommends = "libpulse0, libpipewire-0.3-0, gnome-keyring | kwalletmanager, libglib2.0-bin, librsvg2-bin, libsdl2-2.0-0"
suggests = "ethtool"
assets = [
    ["target/release/openuuyc", "usr/bin/", "755"],
    # 被控端加虚拟屏要写 configfs，只有 root 能写，所以另有一个按需启动的系统服务。
    # 它的两个单元由下面的 systemd-units 装进 /usr/lib/systemd/system。
    ["package/linux/openuuyc.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/openuuyc.png", "644"],
    ["package/linux/60-openuuyc-uinput.rules", "usr/lib/udev/rules.d/", "644"],
    ["package/linux/openuuyc.service", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/openuuyc/", "644"],
    ["NOTICES.md", "usr/share/doc/openuuyc/", "644"],
    ["LICENSE", "usr/share/doc/openuuyc/licenses/", "644"],
]
# 自动生成 VKMS 单元的卸载/清除及升级维护逻辑；不直接启动特权服务。
# postinst 只自动启用并启动 socket，由首次连接按需拉起 `openuuyc vkms`。
maintainer-scripts = "package/linux"
systemd-units = { unit-name = "openuuyc-vkms", enable = false, start = false }

[dependencies]
hex = "0.4.3"
anyhow = "1.0.104"
async-trait = "0.1.92"
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
base64 = "0.23.1"
bytes = "1.12.1"
crossbeam-queue = "0.3.14"
cpal = "0.18.2"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dunce = "1.0.5"
egui = { version = "0.37.0", default-features = false, features = ["bytemuck"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
goog_cc = { path = "vendor/goog_cc" }
# 被控端使用 NVENC 硬件编码，驱动库在运行时加载。
openuuyc-nvenc-sys = { path = "vendor/nvenc-sys" }
hmac = "0.13.0"
hyper = { version = "1.12.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
keyring = "4.2.0"
keyring-core = "=1.0.1"
kcp = { path = "vendor/kcp" }
opusic-c = "1.6.1"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "system-proxy", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
semver = "1.0.28"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "v5"] }
webrtc = { path = "vendor/webrtc" }
webrtc-srtp = "0.17.2"
yuv = "0.8.19"
object = { version = "0.40.0", default-features = false, features = ["read_core", "std", "pe"] }
openuuyc-plugin-api = { path = "plugins/sdk" }
libloading = "0.9.0"
openuuyc-codec = { path = "crates/codec" }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
zip = { version = "9.1.3", default-features = false, features = ["zstd"] }
regex = "1.13.1"

# 被控终端按终端模型保存各会话的屏幕，而不是保存字节日志；重新接入时重放屏幕状态，
# 避免重新输入可能在转义序列中间截断的原始输出。
# 参考服务端的 `vt100-psmux` 分支以此上游库为基础。
vt100 = "0.18.1"

[build-dependencies]
cc = "1.10.0"
epaint_default_fonts = { version = "=0.37.0", features = ["monochrome_emoji_fonts"] }
flate2 = "1.1.10"

[target.'cfg(target_os = "linux")'.dependencies]
glow = "0.18.0"
# 获取观看端的本地显示器几何信息，同时适用于 X11 和 Wayland。
display-info = "0.5.10"
# 被控端加虚拟屏要写 configfs，只有 root 能写，中间隔一个专用的辅助程序
# （crates/vkms）。这里用的是它的客户端部分。
openuuyc-vkms = { path = "crates/vkms" }
cros-libva = { path = "vendor/cros-libva" }
# 为 VA-API 切片参数提供 H.264 语法和错误类型；
# 软件解码会话本身仍通过 openuuyc-codec 处理，与原有实现一致。
openuuyc-h264 = { path = "crates/codec/kernels/h264" }
egui-wgpu = { version = "0.37.0", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "gles", "wgsl"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links", "x11", "wayland"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
# 查询剪贴板的 MIME 类型只需一次 Wayland 往返；`arboard` 的每个读取接口都会
# 新建连接并拉取完整数据。因此轮询先检查类型，仅在类型变化时读取内容。
wl-clipboard-rs = { version = "0.9.5", default-features = false }
# Wayland 文本输入：zwp_virtual_keyboard 允许自带 keymap，能输入键位表里没有的字符
# （中文等）。XTest 只能影响 XWayland 客户端，uinput 又无法携带 keymap。
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols-misc = { version = "0.3.12", default-features = false, features = ["client"] }
# 被控绝对定位读 xdg_output 的逻辑布局；主控「拦截本机快捷键」用
# zwp_keyboard_shortcuts_inhibit_v1 让合成器在播放窗口有键盘焦点时让出自己的
# 快捷键（两者在 unstable 后面）；再次启动时用 xdg_activation_v1 凭启动令牌把
# 已在运行的控制中心提到前台（staging）。
wayland-protocols = { version = "0.32.13", default-features = false, features = ["client", "staging", "unstable"] }
# wlr-screencopy 是合成器直接提供的复制协议，niri、wlroots 及其衍生实现支持它；
# 与门户不同，该协议不会请求本地用户确认。
# 同一库也提供图层外壳，Wayland 拖出捕获器借此放置透明表面。
wayland-protocols-wlr = { version = "0.3.12", default-features = false, features = ["client"] }
libc = "0.2.191"
fuser = { version = "0.18.0", default-features = false }
x11rb = { version = "0.14.0", features = ["dpms", "randr", "shm", "xfixes", "xtest"] }
# 通知区域图标（StatusNotifierItem），用于桌面托盘。
# zbus 必须使用 async-io：tokio 特性会全局生效，导致密钥环的阻塞式 Secret Service
# 调用在本程序的运行时内触发恐慌。
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
# 桌面通知（org.freedesktop.Notifications）；与上面一样使用 async-io 版本的 zbus。
# zbus 6 移除了桌面集成所需的阻塞接口。
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# 通过 XDG ScreenCast 门户采集被控端画面，适用于 Wayland，也可按需用于 X11。
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast"] }
pollster = "1.0.1"
# 播放和麦克风通过声音服务原生协议复用一条连接（PulseAudio 或 PipeWire 的 pulse
# 服务），与 Sunshine 相同；ALSA 的 pulse 插件每次探测设备都会新建服务端连接。
# 声音服务存在时 cpal::default_host() 优先选用它，否则使用 ALSA。
cpal = { version = "0.18.2", features = ["pulseaudio"] }

# 以下为带项目适配的补丁版本，不是原样复制；来源与替换条件见 vendor/README.md。
[patch.crates-io]
dtls = { path = "vendor/dtls" }
interceptor = { path = "vendor/interceptor" }
rtcp = { path = "vendor/rtcp" }
turn = { path = "vendor/turn" }
webrtc-ice = { path = "vendor/webrtc-ice" }
webrtc-sctp = { path = "vendor/webrtc-sctp" }
webrtc-srtp = { path = "vendor/webrtc-srtp" }
webrtc-util = { path = "vendor/webrtc-util" }

[profile.release]
# 保留播放依赖（包括解码器和 SIMD 内核）原有的性能优化设置。
# 解码器对比中，跨库 LTO 会改变热点代码布局。
opt-level = 3
lto = false
# 只使用一个代码生成单元，避免重复生成异步状态机和栈展开元数据。
codegen-units = 1
strip = "debuginfo"
# 解码工作线程依赖栈展开隔离故障并释放资源。
panic = "unwind"

[profile.release.package.openuuyc]
# 应用衔接代码优先优化体积，不改动解码器和数字信号处理依赖的优化设置。
opt-level = "s"

# 保留视频和 SIMD 内核已经验证的代码生成设置。
[profile.release.package.openuuyc-h264]
codegen-units = 16

[profile.release.package.yuv]
codegen-units = 16

# 启动、HTTP 管理和证书解析不在媒体处理路径上，可优先优化体积。
# 实时传输、加密、渲染和编解码仍保持 3 级优化。
[profile.release.package.reqwest]
opt-level = "s"

[profile.release.package.clap_builder]
opt-level = "s"

[profile.release.package.x509-parser]
opt-level = "s"

[profile.dev.package.yuv]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.openuuyc-h264]
opt-level = 3

[profile.dev.package.openuuyc-h265-syntax]
opt-level = 3
debug-assertions = false
overflow-checks = false
