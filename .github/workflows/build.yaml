name: Release for Linux

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dpkg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: version
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib
          from pathlib import Path

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit(f"Expected a stable major.minor.patch version, got: {version}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\ntag=v{version}\n")
          PYTHON

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang nasm pkg-config dpkg-dev libva-dev \
            libasound2-dev libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxcursor-dev libgl1-mesa-dev libvulkan-dev libudev-dev libssl-dev

      - name: Get Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-deb
        uses: taiki-e/install-action@main
        with:
          tool: cargo-deb

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --bin openuuyc

      - name: Package to deb
        shell: bash
        run: cargo deb --no-build

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p dist
          install -Dm755 target/release/openuuyc dist/openuuyc
          mv target/debian/*.deb dist/

      - name: Upload the release files
        uses: actions/upload-artifact@main
        with:
          name: release_dpkg
          path: dist/*
          if-no-files-found: error

  pacman:
    needs: dpkg
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      RELEASE_VERSION: ${{ needs.dpkg.outputs.version }}
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed archlinux-keyring base-devel git zstd

      - name: Checkout packaging files
        uses: actions/checkout@main

      - name: Download the release files
        uses: actions/download-artifact@main
        with:
          name: release_dpkg
          path: dist

      - name: Build the pacman package
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid stable release version: %s\n' "$version" >&2
            exit 1
          fi
          mkdir -p /tmp/pacman-package/src/openuuyc/{target/release,assets}
          cp package/arch/{PKGBUILD,openuuyc.install} /tmp/pacman-package/
          # 直接使用本轮二进制和检出的打包文件，不依赖中间压缩包。
          install -Dm755 dist/openuuyc /tmp/pacman-package/src/openuuyc/target/release/openuuyc
          cp -a package /tmp/pacman-package/src/openuuyc/
          cp assets/icon-256.png /tmp/pacman-package/src/openuuyc/assets/
          cp LICENSE NOTICES.md /tmp/pacman-package/src/openuuyc/
          sed -i "s|@PKGVER@|$version|g" /tmp/pacman-package/PKGBUILD
          # 版本号原样使用，pkgrel 固定为 1；跳过源码下载和重复构建。
          cat >> /tmp/pacman-package/PKGBUILD <<'PKGBUILD'
          source=()
          sha256sums=()
          prepare() { :; }
          build() { :; }
          PKGBUILD
          useradd --create-home builder
          chown -R builder:builder /tmp/pacman-package
          runuser -u builder -- bash -c 'cd /tmp/pacman-package && makepkg --noextract --nodeps --noconfirm'
          mkdir -p dist
          cp /tmp/pacman-package/*.pkg.tar.zst dist/
          pacman -Qip dist/*.pkg.tar.zst

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.dpkg.outputs.tag }}
          files: |
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/openuuyc
          body: |
            # OpenUUYC ${{ needs.dpkg.outputs.tag }}
            ## 📝 Release Notes
            - Fixes and improvements.
            ## For the ArchLinux users
            - Install the Arch package with `sudo pacman -U openuuyc-${{ needs.dpkg.outputs.version }}-1-x86_64.pkg.tar.zst`.
            - Debian/Ubuntu users can install the `.deb`; the standalone `openuuyc` executable is also available.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
