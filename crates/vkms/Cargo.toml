[package]
name = "openuuyc-vkms"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
license-file = "../../LICENSE"
description = "OpenUUYC 内建虚拟显示器模块：客户端与特权服务入口"

# 自成一体：主仓库没有 workspace 表，这里也不参与任何 workspace。
[workspace]

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 判定「这个 pid 属于一个活动会话吗」要问 systemd-logind，只有辅助程序用得到。
# 特性必须和主程序保持一致：zbus 的 feature 是全局的，这里多开一个会改掉主程序的构建。
# zbus 6 移除了桌面集成所需的阻塞接口。
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
